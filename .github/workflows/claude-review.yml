name: Claude PR Review

# PR이 열리거나 새 커밋이 올라오면 Claude가 변경을 읽고 리뷰 댓글을 남긴다. 병합을 막지 않는다 —
# 검사(lint·typecheck·test·build)는 CI Harness가 맡고, 이것은 사람이 놓치기 쉬운 것(CLAUDE.md 규칙,
# 앱과 웹의 차이, 보안)을 짚는 피드백이다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions에 ANTHROPIC_API_KEY를 넣는다
# (Claude 구독으로 쓰려면 `claude setup-token`으로 만든 CLAUDE_CODE_OAUTH_TOKEN). 둘 다 없으면
# 이 작업은 건너뛴다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude review
    # 미러(Grad-Deploy/subslash)와 포크에서 온 PR에서는 돌지 않는다 — 비밀값이 없거나 넘기면 안 된다.
    if: >-
      github.repository == 'leesean2/subslash' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check credentials
        id: creds
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "ok=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review
        if: steps.creds.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            저장소 ${{ github.repository }}의 PR #${{ github.event.pull_request.number }}를 리뷰해 주세요.
            먼저 루트의 CLAUDE.md를 읽고, 그 규칙을 기준으로 변경(diff)만 봅니다.

            다음을 짚어 주세요. 확실한 문제만 적고, 추측은 '확인 필요'로 표시합니다.
            1. 버그: 잘못된 계산, 빠진 null 처리, 경쟁 상태, 깨지는 경계값.
            2. CLAUDE.md 위반: 모르는 값을 기본값으로 채우기, 합산 헬퍼 대신 reduce, 앱에서 깨지는 코드
               (fetch 대신 apiFetch, window.open 대신 openExternal, 동적 경로, 페이지 새로고침 이동,
               confirm/alert, 이모지), 서버가 브라우저 기록을 고치는 흐름, 개인정보처리방침과 어긋나는 저장.
            3. 보안: 인증·권한 누락, 요청 수 제한이 필요한 곳, 토큰을 주소에 싣기, 입력 검증, XSS.
            4. 테스트: 바뀐 동작을 확인하는 테스트가 있는지.
            5. 리팩토링: 같은 로직의 중복, 지나치게 복잡한 코드(작은 것만, 범위를 넓히지 않게).

            문제가 있는 줄에는 인라인 댓글(mcp__github_inline_comment__create_inline_comment)을 달고,
            마지막에 한국어로 요약 댓글 하나를 남깁니다(gh pr comment). 문제가 없으면 짧게 그렇다고 적습니다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
