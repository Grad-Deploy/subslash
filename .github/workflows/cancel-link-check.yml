name: Cancel Link Check

# 프리셋 해지 링크가 아직 살아 있는지 매달 확인한다. 링크를 고치지는 않고,
# 사람이 봐야 할 것이 있을 때만 이슈를 연다(이미 열려 있으면 댓글을 단다).
on:
  schedule:
    # 매월 1일 00:00 UTC (09:00 KST)
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check cancel links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        # Version comes from "packageManager" in package.json; specifying it
        # here as well makes the action fail with a version mismatch.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check links
        id: check
        env:
          REPORT_PATH: ${{ runner.temp }}/cancel-link-report.md
        run: pnpm --filter @subslash/web check:cancel-links

      - name: Write job summary
        env:
          REPORT_PATH: ${{ runner.temp }}/cancel-link-report.md
        run: cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update issue
        if: steps.check.outputs.needs_review != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/cancel-link-report.md
          NEEDS_REVIEW: ${{ steps.check.outputs.needs_review }}
        run: |
          gh label create cancel-link-check --color d93f0b \
            --description "월간 해지 링크 점검 결과" --force
          number=$(gh issue list --label cancel-link-check --state open \
            --json number --jq '.[].number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$REPORT_PATH"
          else
            gh issue create --label cancel-link-check \
              --title "해지 링크 점검: 확인 필요 ${NEEDS_REVIEW}건" \
              --body-file "$REPORT_PATH"
          fi
