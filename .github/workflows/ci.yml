name: CI Harness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 검사는 코드를 읽기만 한다. 저장소의 기본 권한 설정이 바뀌어도 넓어지지 않게 적어 둔다.
permissions:
  contents: read

jobs:
  verify:
    name: Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        # Version comes from "packageManager" in package.json; specifying it
        # here as well makes the action fail with a version mismatch.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: TypeScript Typecheck
        run: pnpm turbo typecheck

      - name: Unit & Integration Tests (Vitest)
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

      - name: App build (static export for Capacitor)
        # 앱에 담을 화면이 정적 내보내기로 만들어지는지 본다. 서버가 있어야 하는 기능(동적 경로,
        # redirects, 서버 전용 페이지 기능)이 화면에 들어오면 여기서 실패한다. 주소는 이 검사에서만
        # 쓰는 자리표시자다.
        run: pnpm --filter @subslash/web build:app
        env:
          NEXT_PUBLIC_WEB_ORIGIN: https://example.invalid

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        # Version comes from "packageManager" in package.json; specifying it
        # here as well makes the action fail with a version mismatch.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      - name: Install Playwright Browsers
        run: pnpm --filter @subslash/web exec playwright install --with-deps chromium webkit

      - name: Run E2E Tests
        run: pnpm turbo test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
