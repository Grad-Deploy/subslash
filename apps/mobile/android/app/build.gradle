apply plugin: 'com.android.application'

def kakaoNativeAppKey = (project.findProperty('KAKAO_NATIVE_APP_KEY') ?: '').toString().trim()
// 테스트용 앱(.dev)은 카카오 콘솔에 따로 만든 네이티브 앱 키를 쓴다. 콘솔은 키 하나에 패키지명을 하나만 받아,
// 스토어 앱의 키로는 com.subslash.app.dev가 카카오톡 로그인을 할 수 없다. 같은 카카오 앱(ID 1589535)의 키라
// 서버의 앱 ID 확인(KAKAO_APP_ID)과 회원 번호는 스토어 앱과 같다.
def kakaoDevNativeAppKey = (project.findProperty('KAKAO_NATIVE_APP_KEY_DEV') ?: '').toString().trim()

android {
    namespace = "com.subslash.app"
    buildFeatures {
        buildConfig = true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.subslash.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 39
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 홈 화면·최근 앱에 보이는 이름. 테스트용 빌드(아래 debug)만 바꾼다.
        manifestPlaceholders = [appLabel: "@string/app_name", kakaoScheme: "kakao${kakaoNativeAppKey}"]
        // 카카오 로그인(KakaoLoginPlugin). 키가 없으면 플러그인이 '쓸 수 없음'이라 답하고 화면은 인앱 브라우저로 한다.
        buildConfigField "String", "KAKAO_NATIVE_APP_KEY", "\"${kakaoNativeAppKey}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // 비밀번호는 저장소에 두지 않는다. ~/.gradle/gradle.properties(또는 -P)의 RELEASE_STORE_PASSWORD·
            // RELEASE_KEY_ALIAS·RELEASE_KEY_PASSWORD로 받는다. 키스토어는 RELEASE_STORE_FILE이 없으면
            // apps/mobile의 .jks(.gitignore)를 쓴다 — gradle.properties는 ISO-8859-1로 읽혀 한글 경로가 깨진다.
            if (project.hasProperty('RELEASE_STORE_PASSWORD')) {
                storeFile file(project.findProperty('RELEASE_STORE_FILE') ?: "${projectDir}/../../@leesean2__subslash-mobile.jks")
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            // 테스트용 빌드(`pnpm --filter @subslash/mobile android:dev`가 -PdevApp으로 만든다)는 스토어 앱과
            // 다른 ID·이름이라 나란히 설치된다. 스토어 앱을 지우지 않아도 되고(서명이 달라 덮어 설치할 수 없다),
            // 기록도 따로라 테스트하느라 실제 기록을 건드리지 않는다. 버전을 올릴 필요도 없다.
            if (project.hasProperty('devApp')) {
                applicationIdSuffix ".dev"
                manifestPlaceholders = [appLabel: "SubSlash Dev", kakaoScheme: "kakao${kakaoDevNativeAppKey}"]
                buildConfigField "String", "KAKAO_NATIVE_APP_KEY", "\"${kakaoDevNativeAppKey}\""
            }
        }
        release {
            // R8로 쓰지 않는 코드를 빼고 최적화·난독화한다. 플러그인은 Capacitor가 함께 주는 keep 규칙
            // (@CapacitorPlugin·@PluginMethod)이 지키고, 웹뷰에 노출하는 @JavascriptInterface는 아래
            // 기본 규칙이 지킨다. 앱에서만 쓰는 규칙은 proguard-rules.pro에 둔다.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 카카오톡 앱으로 로그인(KakaoLoginPlugin). 버전을 올리면 proguard-rules.pro의 카카오 규칙도 확인한다.
    implementation "com.kakao.sdk:v2-user:2.25.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('copyReleaseBundleToDesktop') {
    doNotTrackState("Copies AAB to Desktop without tracking entire Desktop state")
    doLast {
        def desktopDir = file("${System.getProperty('user.home')}/OneDrive/바탕 화면")
        if (!desktopDir.exists()) {
            desktopDir = file("${System.getProperty('user.home')}/Desktop")
        }
        copy {
            from layout.buildDirectory.dir("outputs/bundle/release")
            into desktopDir
            include "*.aab"
            rename { String fileName -> "subslash-release-v${android.defaultConfig.versionCode}.aab" }
        }
        println "=========================================================="
        println " [SubSlash] 서명된 AAB 파일이 바탕화면에 복사되었습니다!"
        println " 위치: ${desktopDir}\\subslash-release-v${android.defaultConfig.versionCode}.aab"
        println "=========================================================="
    }
}

tasks.matching { it.name == "bundleRelease" }.configureEach {
    finalizedBy("copyReleaseBundleToDesktop")
}
